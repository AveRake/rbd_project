<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="950" viewBox="0 0 1700 950"><title>Нотация связей «вороньи лапки»</title><rect width="100%" height="100%" fill="#ffffff"/>
<text x="40" y="54" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="bold" text-anchor="start" fill="#111827">Нотация связей «вороньи лапки» (crow's foot)</text>
<text x="40" y="92" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="normal" text-anchor="start" fill="#4b5563">Как читать ER-диаграммы CampusRent: символы у концов линии связи</text>
<rect x="30" y="130" width="380" height="150" rx="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="2"/>
<rect x="270" y="165" width="120" height="60" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="2"/>
<text x="330.0" y="205" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="normal" text-anchor="middle" fill="#6b7280">…</text>
<line x1="70" y1="195" x2="270" y2="195" stroke="#1f2937" stroke-width="2.2" stroke-linecap="round"/>
<line x1="248" y1="210" x2="248" y2="180" stroke="#1f2937" stroke-width="2.4" stroke-linecap="round"/>
<text x="236" y="177" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#1f2937">1</text>
<text x="50" y="240" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="start" fill="#111827">одна черта — «один»</text>
<text x="50" y="268" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="normal" text-anchor="start" fill="#4b5563">ровно один экземпляр</text>
<rect x="450" y="130" width="380" height="150" rx="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="2"/>
<rect x="690" y="165" width="120" height="60" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="2"/>
<text x="750.0" y="205" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="normal" text-anchor="middle" fill="#6b7280">…</text>
<line x1="490" y1="195" x2="690" y2="195" stroke="#1f2937" stroke-width="2.2" stroke-linecap="round"/>
<line x1="690" y1="211" x2="664" y2="195" stroke="#1f2937" stroke-width="2.4" stroke-linecap="round"/>
<line x1="690" y1="179" x2="664" y2="195" stroke="#1f2937" stroke-width="2.4" stroke-linecap="round"/>
<text x="646" y="177" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#1f2937">N</text>
<text x="470" y="240" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="start" fill="#111827">воронья лапка — «многие»</text>
<text x="470" y="268" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="normal" text-anchor="start" fill="#4b5563">много экземпляров</text>
<rect x="870" y="130" width="380" height="150" rx="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="2"/>
<rect x="1110" y="165" width="120" height="60" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="2"/>
<text x="1170.0" y="205" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="normal" text-anchor="middle" fill="#6b7280">…</text>
<line x1="910" y1="195" x2="1110" y2="195" stroke="#1f2937" stroke-width="2.2" stroke-linecap="round"/>
<line x1="932" y1="180" x2="932" y2="210" stroke="#1f2937" stroke-width="2.4" stroke-linecap="round"/>
<line x1="1110" y1="211" x2="1084" y2="195" stroke="#1f2937" stroke-width="2.4" stroke-linecap="round"/>
<line x1="1110" y1="179" x2="1084" y2="195" stroke="#1f2937" stroke-width="2.4" stroke-linecap="round"/>
<text x="932" y="177" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#1f2937">1</text>
<text x="1066" y="177" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#1f2937">N</text>
<text x="890" y="240" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="start" fill="#111827">один ко многим (1:N)</text>
<text x="890" y="268" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="normal" text-anchor="start" fill="#4b5563">основной тип связи в БД</text>
<rect x="1290" y="130" width="380" height="150" rx="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="2"/>
<rect x="1530" y="165" width="120" height="60" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="2"/>
<text x="1590.0" y="205" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="normal" text-anchor="middle" fill="#6b7280">…</text>
<line x1="1330" y1="195" x2="1530" y2="195" stroke="#1f2937" stroke-width="2.2" stroke-linecap="round"/>
<circle cx="1474.9" cy="195.0" r="9" fill="#ffffff" stroke="#1f2937" stroke-width="2.4"/>
<line x1="1530" y1="211" x2="1504" y2="195" stroke="#1f2937" stroke-width="2.4" stroke-linecap="round"/>
<line x1="1530" y1="179" x2="1504" y2="195" stroke="#1f2937" stroke-width="2.4" stroke-linecap="round"/>
<text x="1438" y="177" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#1f2937">0..N</text>
<text x="1310" y="240" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="start" fill="#111827">кружок — «необязательно»</text>
<text x="1310" y="268" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="normal" text-anchor="start" fill="#4b5563">связь может отсутствовать (0..N)</text>
<rect x="30" y="300" width="1640" height="200" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
<text x="60" y="338" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="start" fill="#1f2937">Пример 1. Один к одному (1:1): «Заявка» — «Договор»</text>
<rect x="140" y="356" width="300" height="70" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2.2"/>
<text x="290.0" y="387.0" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="bold" text-anchor="middle" fill="#b91c1c">Заявка</text>
<text x="290.0" y="415.0" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="normal" text-anchor="middle" fill="#6b7280" font-style="italic">requests</text>
<rect x="1260" y="356" width="300" height="70" rx="10" fill="#ffedd5" stroke="#c2410c" stroke-width="2.2"/>
<text x="1410.0" y="387.0" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="bold" text-anchor="middle" fill="#c2410c">Договор</text>
<text x="1410.0" y="415.0" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="normal" text-anchor="middle" fill="#6b7280" font-style="italic">contracts</text>
<line x1="440" y1="391" x2="1260" y2="391" stroke="#1f2937" stroke-width="2.2" stroke-linecap="round"/>
<line x1="462" y1="376" x2="462" y2="406" stroke="#1f2937" stroke-width="2.4" stroke-linecap="round"/>
<text x="474" y="373" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#1f2937">1</text>
<line x1="1238" y1="406" x2="1238" y2="376" stroke="#1f2937" stroke-width="2.4" stroke-linecap="round"/>
<text x="1226" y="373" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#1f2937">1</text>
<text x="60" y="460" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="normal" text-anchor="start" fill="#4b5563">У одной заявки не более одного договора; каждый договор относится ровно к одной заявке (со стороны заявки связь</text>
<text x="60" y="490" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="normal" text-anchor="start" fill="#4b5563">необязательна: 0..1).</text>
<rect x="30" y="515" width="1640" height="200" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
<text x="60" y="553" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="start" fill="#1f2937">Пример 2. Один ко многим (1:N): «Модель» — «Экземпляр техники»</text>
<rect x="140" y="571" width="300" height="70" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.2"/>
<text x="290.0" y="602.0" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="bold" text-anchor="middle" fill="#1d4ed8">Модель</text>
<text x="290.0" y="630.0" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="normal" text-anchor="middle" fill="#6b7280" font-style="italic">models</text>
<rect x="1180" y="571" width="380" height="70" rx="10" fill="#fef9c3" stroke="#a16207" stroke-width="2.2"/>
<text x="1370.0" y="602.0" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="bold" text-anchor="middle" fill="#a16207">Экземпляр техники</text>
<text x="1370.0" y="630.0" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="normal" text-anchor="middle" fill="#6b7280" font-style="italic">equipment_units</text>
<line x1="440" y1="606" x2="1180" y2="606" stroke="#1f2937" stroke-width="2.2" stroke-linecap="round"/>
<line x1="462" y1="591" x2="462" y2="621" stroke="#1f2937" stroke-width="2.4" stroke-linecap="round"/>
<text x="474" y="588" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#1f2937">1</text>
<line x1="1180" y1="622" x2="1154" y2="606" stroke="#1f2937" stroke-width="2.4" stroke-linecap="round"/>
<line x1="1180" y1="590" x2="1154" y2="606" stroke="#1f2937" stroke-width="2.4" stroke-linecap="round"/>
<text x="1132" y="588" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#1f2937">N</text>
<text x="60" y="675" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="normal" text-anchor="start" fill="#4b5563">Одной модели соответствует много экземпляров техники; каждый экземпляр принадлежит ровно одной модели.</text>
<rect x="30" y="730" width="1640" height="200" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
<text x="60" y="768" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="start" fill="#1f2937">Пример 3. Многие ко многим (M:N) через промежуточную таблицу</text>
<rect x="110" y="786" width="260" height="70" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2.2"/>
<text x="240.0" y="817.0" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="bold" text-anchor="middle" fill="#b91c1c">Заявка</text>
<text x="240.0" y="845.0" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="normal" text-anchor="middle" fill="#6b7280" font-style="italic">requests</text>
<rect x="700" y="786" width="340" height="70" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2.2"/>
<text x="870.0" y="817.0" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="bold" text-anchor="middle" fill="#b91c1c">Позиция заявки</text>
<text x="870.0" y="845.0" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="normal" text-anchor="middle" fill="#6b7280" font-style="italic">request_items</text>
<rect x="1310" y="786" width="260" height="70" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.2"/>
<text x="1440.0" y="817.0" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="bold" text-anchor="middle" fill="#1d4ed8">Модель</text>
<text x="1440.0" y="845.0" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="normal" text-anchor="middle" fill="#6b7280" font-style="italic">models</text>
<line x1="370" y1="821" x2="700" y2="821" stroke="#1f2937" stroke-width="2.2" stroke-linecap="round"/>
<line x1="392" y1="806" x2="392" y2="836" stroke="#1f2937" stroke-width="2.4" stroke-linecap="round"/>
<line x1="700" y1="837" x2="674" y2="821" stroke="#1f2937" stroke-width="2.4" stroke-linecap="round"/>
<line x1="700" y1="805" x2="674" y2="821" stroke="#1f2937" stroke-width="2.4" stroke-linecap="round"/>
<text x="404" y="803" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#1f2937">1</text>
<text x="652" y="803" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#1f2937">N</text>
<line x1="1040" y1="821" x2="1310" y2="821" stroke="#1f2937" stroke-width="2.2" stroke-linecap="round"/>
<line x1="1040" y1="805" x2="1066" y2="821" stroke="#1f2937" stroke-width="2.4" stroke-linecap="round"/>
<line x1="1040" y1="837" x2="1066" y2="821" stroke="#1f2937" stroke-width="2.4" stroke-linecap="round"/>
<line x1="1288" y1="836" x2="1288" y2="806" stroke="#1f2937" stroke-width="2.4" stroke-linecap="round"/>
<text x="1088" y="803" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#1f2937">N</text>
<text x="1276" y="803" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#1f2937">1</text>
<text x="60" y="890" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="normal" text-anchor="start" fill="#4b5563">Заявка содержит много позиций, каждая позиция ссылается на одну модель: M:N реализуется таблицей request_items.</text>
</svg>
