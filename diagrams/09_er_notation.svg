<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="950" viewBox="0 0 1700 950"><title>Нотация связей «вороньи лапки»</title><rect width="100%" height="100%" fill="#ffffff"/>
<text x="30" y="52" font-family="Helvetica, Arial, sans-serif" font-size="38" font-weight="bold" text-anchor="start" fill="#111827">Нотация связей «вороньи лапки» (crow's foot)</text>
<text x="30" y="90" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="normal" text-anchor="start" fill="#4b5563">Как читать ER-диаграммы CampusRent: символы у концов линии связи</text>
<rect x="30" y="120" width="395" height="182" rx="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="2"/>
<rect x="275" y="145" width="120" height="60" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="2"/>
<text x="335.0" y="185" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="normal" text-anchor="middle" fill="#6b7280">…</text>
<line x1="65" y1="175" x2="275" y2="175" stroke="#1f2937" stroke-width="2.4" stroke-linecap="round"/>
<line x1="253" y1="190" x2="253" y2="160" stroke="#1f2937" stroke-width="2.6" stroke-linecap="round"/>
<text x="253" y="145" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">1</text>
<text x="50" y="245" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="start" fill="#111827">одна черта — «один»</text>
<text x="50" y="277" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="normal" text-anchor="start" fill="#4b5563">ровно один экземпляр</text>
<rect x="445" y="120" width="395" height="182" rx="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="2"/>
<rect x="690" y="145" width="120" height="60" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="2"/>
<text x="750.0" y="185" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="normal" text-anchor="middle" fill="#6b7280">…</text>
<line x1="480" y1="175" x2="690" y2="175" stroke="#1f2937" stroke-width="2.4" stroke-linecap="round"/>
<line x1="690" y1="191" x2="664" y2="175" stroke="#1f2937" stroke-width="2.6" stroke-linecap="round"/>
<line x1="690" y1="159" x2="664" y2="175" stroke="#1f2937" stroke-width="2.6" stroke-linecap="round"/>
<text x="650" y="139" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">N</text>
<text x="465" y="245" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="start" fill="#111827">воронья лапка — N</text>
<text x="465" y="277" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="normal" text-anchor="start" fill="#4b5563">много экземпляров</text>
<rect x="860" y="120" width="395" height="182" rx="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="2"/>
<rect x="1105" y="145" width="120" height="60" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="2"/>
<text x="1165.0" y="185" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="normal" text-anchor="middle" fill="#6b7280">…</text>
<line x1="895" y1="175" x2="1105" y2="175" stroke="#1f2937" stroke-width="2.4" stroke-linecap="round"/>
<line x1="917" y1="160" x2="917" y2="190" stroke="#1f2937" stroke-width="2.6" stroke-linecap="round"/>
<line x1="1105" y1="191" x2="1079" y2="175" stroke="#1f2937" stroke-width="2.6" stroke-linecap="round"/>
<line x1="1105" y1="159" x2="1079" y2="175" stroke="#1f2937" stroke-width="2.6" stroke-linecap="round"/>
<text x="917" y="145" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">1</text>
<text x="1065" y="139" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">N</text>
<text x="880" y="245" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="start" fill="#111827">один ко многим (1:N)</text>
<text x="880" y="277" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="normal" text-anchor="start" fill="#4b5563">основной тип связи в БД</text>
<rect x="1275" y="120" width="395" height="182" rx="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="2"/>
<rect x="1520" y="145" width="120" height="60" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="2"/>
<text x="1580.0" y="185" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="normal" text-anchor="middle" fill="#6b7280">…</text>
<line x1="1310" y1="175" x2="1520" y2="175" stroke="#1f2937" stroke-width="2.4" stroke-linecap="round"/>
<circle cx="1464.9" cy="175.0" r="9" fill="#ffffff" stroke="#1f2937" stroke-width="2.6"/>
<line x1="1520" y1="191" x2="1494" y2="175" stroke="#1f2937" stroke-width="2.6" stroke-linecap="round"/>
<line x1="1520" y1="159" x2="1494" y2="175" stroke="#1f2937" stroke-width="2.6" stroke-linecap="round"/>
<text x="1425" y="145" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">0..N</text>
<text x="1295" y="245" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="start" fill="#111827">кружок — «0..N»</text>
<text x="1295" y="277" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="normal" text-anchor="start" fill="#4b5563">связь может отсутствовать</text>
<rect x="30" y="310" width="1640" height="198" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
<text x="60" y="344" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="start" fill="#1f2937">Пример 1. Один к одному (1:1): «Заявка» — «Договор»</text>
<rect x="110" y="372" width="200" height="64" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2.4"/>
<text x="210.0" y="400.0" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" fill="#b91c1c">Заявка</text>
<text x="210.0" y="428.0" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="normal" text-anchor="middle" fill="#6b7280" font-style="italic">requests</text>
<rect x="1290" y="372" width="220" height="64" rx="10" fill="#ffedd5" stroke="#c2410c" stroke-width="2.4"/>
<text x="1400.0" y="400.0" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" fill="#c2410c">Договор</text>
<text x="1400.0" y="428.0" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="normal" text-anchor="middle" fill="#6b7280" font-style="italic">contracts</text>
<line x1="310" y1="404" x2="1290" y2="404" stroke="#1f2937" stroke-width="2.4" stroke-linecap="round"/>
<line x1="332" y1="389" x2="332" y2="419" stroke="#1f2937" stroke-width="2.6" stroke-linecap="round"/>
<text x="332" y="374" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">1</text>
<line x1="1268" y1="419" x2="1268" y2="389" stroke="#1f2937" stroke-width="2.6" stroke-linecap="round"/>
<text x="1268" y="374" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">1</text>
<text x="60" y="466" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="normal" text-anchor="start" fill="#4b5563">У одной заявки не более одного договора; каждый договор относится ровно к одной заявке (со стороны заявки</text>
<text x="60" y="498" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="normal" text-anchor="start" fill="#4b5563">связь необязательна: 0..1).</text>
<rect x="30" y="520" width="1640" height="198" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
<text x="60" y="554" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="start" fill="#1f2937">Пример 2. Один ко многим (1:N): «Модель» — «Экземпляр техники»</text>
<rect x="110" y="582" width="200" height="64" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.4"/>
<text x="210.0" y="610.0" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" fill="#1d4ed8">Модель</text>
<text x="210.0" y="638.0" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="normal" text-anchor="middle" fill="#6b7280" font-style="italic">models</text>
<rect x="1200" y="582" width="360" height="64" rx="10" fill="#fef9c3" stroke="#a16207" stroke-width="2.4"/>
<text x="1380.0" y="610.0" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" fill="#a16207">Экземпляр техники</text>
<text x="1380.0" y="638.0" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="normal" text-anchor="middle" fill="#6b7280" font-style="italic">equipment_units</text>
<line x1="310" y1="614" x2="1200" y2="614" stroke="#1f2937" stroke-width="2.4" stroke-linecap="round"/>
<line x1="332" y1="599" x2="332" y2="629" stroke="#1f2937" stroke-width="2.6" stroke-linecap="round"/>
<text x="332" y="584" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">1</text>
<line x1="1200" y1="630" x2="1174" y2="614" stroke="#1f2937" stroke-width="2.6" stroke-linecap="round"/>
<line x1="1200" y1="598" x2="1174" y2="614" stroke="#1f2937" stroke-width="2.6" stroke-linecap="round"/>
<text x="1158" y="578" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">N</text>
<text x="60" y="676" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="normal" text-anchor="start" fill="#4b5563">Одной модели соответствует много экземпляров техники; каждый экземпляр принадлежит ровно одной</text>
<text x="60" y="708" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="normal" text-anchor="start" fill="#4b5563">модели.</text>
<rect x="30" y="730" width="1640" height="198" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
<text x="60" y="764" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="start" fill="#1f2937">Пример 3. Многие ко многим (M:N) через промежуточную таблицу</text>
<rect x="90" y="792" width="200" height="64" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2.4"/>
<text x="190.0" y="820.0" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" fill="#b91c1c">Заявка</text>
<text x="190.0" y="848.0" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="normal" text-anchor="middle" fill="#6b7280" font-style="italic">requests</text>
<rect x="680" y="792" width="300" height="64" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2.4"/>
<text x="830.0" y="820.0" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" fill="#b91c1c">Позиция заявки</text>
<text x="830.0" y="848.0" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="normal" text-anchor="middle" fill="#6b7280" font-style="italic">request_items</text>
<rect x="1330" y="792" width="200" height="64" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.4"/>
<text x="1430.0" y="820.0" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" fill="#1d4ed8">Модель</text>
<text x="1430.0" y="848.0" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="normal" text-anchor="middle" fill="#6b7280" font-style="italic">models</text>
<line x1="290" y1="824" x2="680" y2="824" stroke="#1f2937" stroke-width="2.4" stroke-linecap="round"/>
<line x1="312" y1="809" x2="312" y2="839" stroke="#1f2937" stroke-width="2.6" stroke-linecap="round"/>
<line x1="680" y1="840" x2="654" y2="824" stroke="#1f2937" stroke-width="2.6" stroke-linecap="round"/>
<line x1="680" y1="808" x2="654" y2="824" stroke="#1f2937" stroke-width="2.6" stroke-linecap="round"/>
<text x="312" y="794" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">1</text>
<text x="638" y="788" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">N</text>
<line x1="980" y1="824" x2="1330" y2="824" stroke="#1f2937" stroke-width="2.4" stroke-linecap="round"/>
<line x1="980" y1="808" x2="1006" y2="824" stroke="#1f2937" stroke-width="2.6" stroke-linecap="round"/>
<line x1="980" y1="840" x2="1006" y2="824" stroke="#1f2937" stroke-width="2.6" stroke-linecap="round"/>
<line x1="1308" y1="839" x2="1308" y2="809" stroke="#1f2937" stroke-width="2.6" stroke-linecap="round"/>
<text x="1022" y="788" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="start" fill="#1f2937">N</text>
<text x="1308" y="794" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#1f2937">1</text>
<text x="60" y="886" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="normal" text-anchor="start" fill="#4b5563">Заявка содержит много позиций, каждая позиция ссылается на одну модель: M:N реализуется таблицей</text>
<text x="60" y="918" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="normal" text-anchor="start" fill="#4b5563">request_items.</text>
</svg>
